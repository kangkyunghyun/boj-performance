# 이 저장소의 의존성은 워크플로가 SHA로 고정한 GitHub Actions뿐이다.
# 고정한 SHA를 주 1회 확인해 한 PR로 묶어 develop에 올린다. 병합은 사람이 squash로 한다.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
