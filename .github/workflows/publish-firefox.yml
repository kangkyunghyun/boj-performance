name: Publish Firefox Add-ons

# 수동 실행. main에서, 태그 v<버전>이 main 최신 커밋을 가리킬 때만 게시한다.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "게시할 manifest 버전. 예: 1.0.6"
        required: true
        type: string
      confirm_publish:
        description: "확인 문구 publish-firefox 입력"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Publish Firefox Add-ons
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify input
        env:
          CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "main에서만 실행한다. 지금: $GITHUB_REF_NAME"
            exit 1
          fi
          if [ "$CONFIRM_PUBLISH" != "publish-firefox" ]; then
            echo "confirm_publish는 publish-firefox 이어야 한다."
            exit 1
          fi

      # 버전 형식, manifest version, 태그가 지금 커밋인지 확인 뒤 zip 생성
      - name: Package
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: scripts/package.sh "$INPUT_VERSION"

      - name: Publish
        env:
          FIREFOX_PACKAGE_FILE: boj-performance-v${{ inputs.version }}.zip
          FIREFOX_RELEASE_NOTES_FILE: docs/releases/v${{ inputs.version }}.md
          FIREFOX_ADDON_ID: boj-performance
          FIREFOX_LICENSE: MIT
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
        run: node scripts/publish-firefox.js
