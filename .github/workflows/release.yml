name: Release

# v*.*.* 태그 push로 zip과 GitHub Release를 만든다. 본문은 docs/releases/v<버전>.md.
# 스토어 게시는 publish-chrome, publish-firefox를 따로 실행한다.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # 태그와 manifest version 일치 확인 뒤 boj-performance-v<버전>.zip 생성
      - name: Package
        run: scripts/package.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [ ! -s "$notes" ]; then
            echo "릴리스 노트가 없다: $notes"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "boj-performance-$GITHUB_REF_NAME.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$notes"
