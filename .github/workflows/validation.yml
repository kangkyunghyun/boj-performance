name: Validation

# 순수 함수 테스트와 확장 zip 확인. 러너 기본 node를 쓴다(node --test 지원).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Unit tests
        run: |
          node --version
          node --test

      - name: Package src
        run: |
          (cd src && zip -qr "$RUNNER_TEMP/ext.zip" . -x '.*')
          unzip -l "$RUNNER_TEMP/ext.zip" manifest.json
          unzip -p "$RUNNER_TEMP/ext.zip" manifest.json | node -e 'JSON.parse(require("fs").readFileSync(0, "utf8"))'
